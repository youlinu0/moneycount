<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f6f2">
<title>記帳日常</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#25352d;background:#f4f6f2}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:32px 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
h1{font-size:26px;margin:0}header p{color:#748078;margin:5px 0 0;font-size:14px}
.month{display:flex;align-items:center;gap:12px;background:white;border:1px solid #e2e8e1;border-radius:14px;padding:8px}
.month button,.delete{border:0;background:#edf3ee;color:#315943;border-radius:9px;padding:9px 12px;cursor:pointer}
#monthLabel{font-weight:700;min-width:100px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.card,section{background:white;border:1px solid #e3e9e2;border-radius:16px;padding:18px}
.card span{display:block;color:#77837b;font-size:13px;margin-bottom:7px}.card strong{font-size:24px}
.income{color:#36805a}.expense{color:#bd6251}.balance{color:#315943}
section{margin-top:16px}h2{font-size:17px;margin:0 0 15px}
form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{font-size:13px;color:#637168;display:grid;gap:6px}
input,select{width:100%;padding:11px;border:1px solid #dce4dc;border-radius:9px;background:white;font:inherit;color:#25352d}
.wide{grid-column:1/-1}.submit{border:0;border-radius:10px;padding:12px;background:#315943;color:white;font:inherit;font-weight:700;cursor:pointer}
#message{min-height:20px;color:#bd6251;font-size:13px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #edf0ec;font-size:14px}th{color:#7b877e;font-size:12px}
.amount{text-align:right;white-space:nowrap}.delete{padding:7px 10px}.empty{text-align:center;padding:30px;color:#89948c}
.editable-cell{cursor:pointer}.editable-cell:hover{background:#f4f8f4;outline:1px dashed #9bb4a2;outline-offset:-3px;border-radius:6px}.cell-editor{width:100%;min-width:88px;padding:7px 8px;border:1px solid #9bb4a2;border-radius:7px;font:inherit;font-size:13px}
.hint{font-size:12px;color:#87928a;margin:10px 0 0}

.account{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.account span{font-size:12px;color:#68766d}
.account button{border:0;border-radius:9px;padding:9px 12px;background:#315943;color:white;font:inherit;font-weight:700;cursor:pointer}
.account button.secondary{background:#edf3ee;color:#315943}
.account button[hidden]{display:none}
.ai-panel{margin-top:16px}.ai-panel p{color:#728078;font-size:13px;line-height:1.6}.ai-messages{display:grid;gap:10px;max-height:340px;overflow:auto;margin:12px 0}.ai-message{max-width:90%;padding:11px 13px;border-radius:13px;background:#f1f5f1;white-space:pre-wrap;line-height:1.55}.ai-message.user{justify-self:end;background:#315943;color:white}.ai-form{display:grid;grid-template-columns:1fr auto;gap:9px}.ai-form button,.ai-confirm button{border:0;border-radius:9px;padding:10px 14px;background:#315943;color:white;font:inherit;font-weight:700;cursor:pointer}.ai-form button:disabled,.ai-confirm button:disabled{opacity:.55;cursor:wait}.ai-confirm{border:1px solid #dce4dc;border-radius:12px;padding:12px;margin-top:10px;background:#fbfcfa}.ai-confirm button.cancel{background:#edf3ee;color:#315943;margin-left:7px}.ai-status{min-height:20px;color:#bd6251;font-size:13px}
@media(max-width:620px){.wrap{padding:22px 14px 40px}header{align-items:flex-start;flex-direction:column}.cards{gap:7px}.card{padding:13px 10px}.card strong{font-size:19px}form{grid-template-columns:1fr}.wide{grid-column:auto}table th:nth-child(4),table td:nth-child(4){display:none}th,td{padding:10px 5px;font-size:12px}}
</style>
</head>
<body>
<main class="wrap">
<header>
  <div><h1>記帳日常</h1><p>簡單記下每一筆收支</p></div>
  <div class="month"><button id="prev" aria-label="上個月">‹</button><span id="monthLabel"></span><button id="next" aria-label="下個月">›</button></div>
  <div class="account"><span id="authStatus">尚未登入</span><button id="loginButton" type="button">Google 登入</button><button id="logoutButton" class="secondary" type="button" hidden>登出</button></div>
</header>
<div class="cards">
  <div class="card"><span>本月收入</span><strong class="income" id="incomeTotal">0</strong></div>
  <div class="card"><span>本月支出</span><strong class="expense" id="expenseTotal">0</strong></div>
  <div class="card"><span>本月結餘</span><strong class="balance" id="balanceTotal">0</strong></div>
</div>
<section>
  <h2>新增一筆</h2>
  <form id="entryForm">
    <label>類型<select id="kind"><option value="expense">支出</option><option value="income">收入</option></select></label>
    <label>金額（數字）<input id="amount" type="number" min="1" step="1" required placeholder="例如 120"></label>
    <label>分類<select id="category"></select></label>
    <label>日期<input id="entryDate" type="date" required></label>
    <label class="wide">備註（選填）<input id="note" maxlength="120" placeholder="例如 午餐、薪水"></label>
    <button class="submit wide" type="submit">加入記錄</button>
    <div class="wide" id="message" role="status"></div>
  </form>
  <p class="hint">資料會保存在目前這個瀏覽器與裝置中。</p>
</section>
<section>
  <h2>收支紀錄</h2>
  <div style="overflow-x:auto">
    <table><thead><tr><th>日期</th><th>類型</th><th>分類</th><th>備註</th><th class="amount">金額</th><th></th></tr></thead><tbody id="rows"></tbody></table>
  </div>
</section>
<section class="ai-panel" aria-labelledby="aiTitle">
  <h2 id="aiTitle">Gemini AI 小幫手</h2>
  <p>可以詢問收支、整理月報，或用文字新增／修改記帳。送出時會將你的訊息與最近最多 300 筆記帳資料傳給 Google Gemini；任何變更都會先顯示預覽，按「確認套用」後才寫入。刪除也需要確認。</p>
  <div id="aiMessages" class="ai-messages" aria-live="polite"><div class="ai-message">你好！例如：「這個月花最多在哪？」或「把 11/20 的午餐改成 150 元」。</div></div>
  <form id="aiForm" class="ai-form"><input id="aiInput" maxlength="500" autocomplete="off" placeholder="輸入問題或記帳修改指示…"><button id="aiSend" type="submit">送出</button></form>
  <div id="aiStatus" class="ai-status" role="status"></div>
  <div id="aiProposal" class="ai-confirm" hidden></div>
</section>
</main>
<script>
(function(){
  "use strict";
  var STORAGE_KEY="moneycount_entries_v1";
  var selectedMonth=new Date(); selectedMonth.setDate(1);
  var categoryMap={expense:["飲食","交通","生活","購物","娛樂","其他"],income:["薪水","獎金","禮金","其他"]};
  var entries=readEntries();
  window.moneycountGetEntries=function(){return entries.slice();};
  window.moneycountApplyCloudEntries=function(items){entries=items;saveEntries();render();};
  window.moneycountApplyAiChange=function(change){
    var current,updated;
    if(change.type==="add"){
      updated={id:Date.now()+Math.floor(Math.random()*1000),kind:change.entry.kind,amount:change.entry.amount,category:change.entry.category,date:change.entry.date,note:change.entry.note||""};
      entries.push(updated);
      try{saveEntries();}catch(error){entries.pop();throw error;}
      if(window.moneycountSyncSave)window.moneycountSyncSave(updated);
    }else if(change.type==="update"){
      current=entries.find(function(item){return Number(item.id)===Number(change.id);});
      if(!current)throw new Error("找不到要修改的那筆記錄，請重新詢問。");
      updated={id:current.id,kind:change.entry.kind,amount:change.entry.amount,category:change.entry.category,date:change.entry.date,note:change.entry.note||""};
      var index=entries.indexOf(current);entries[index]=updated;
      try{saveEntries();}catch(error){entries[index]=current;throw error;}
      if(window.moneycountSyncSave)window.moneycountSyncSave(updated);
    }else if(change.type==="delete"){
      current=entries.find(function(item){return Number(item.id)===Number(change.id);});
      if(!current)throw new Error("找不到要刪除的那筆記錄，請重新詢問。");
      entries=entries.filter(function(item){return Number(item.id)!==Number(change.id);});
      try{saveEntries();}catch(error){entries.push(current);throw error;}
      if(window.moneycountSyncDelete)window.moneycountSyncDelete(current.id);
    }else{throw new Error("這種變更目前不支援。");}
    render();return updated||current;
  };

  function readEntries(){
    try { var saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]"); return Array.isArray(saved)?saved:[]; }
    catch(error){ return []; }
  }
  function saveEntries(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(entries)); }
  function pad(n){return String(n).padStart(2,"0");}
  function monthKey(){return selectedMonth.getFullYear()+"-"+pad(selectedMonth.getMonth()+1);}
  function localDate(){
    var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  }
  function formatMoney(n){return Number(n||0).toLocaleString("zh-TW");}
  function escapeHtml(value){
    return String(value).replace(/[&<>"']/g,function(ch){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];
    });
  }
  function updateCategories(){
    var kind=document.getElementById("kind").value;
    document.getElementById("category").innerHTML=categoryMap[kind].map(function(name){
      return "<option>"+name+"</option>";
    }).join("");
  }
  function render(){
    document.getElementById("monthLabel").textContent=selectedMonth.getFullYear()+" 年 "+(selectedMonth.getMonth()+1)+" 月";
    var month=monthKey();
    var visible=entries.filter(function(item){return item.date.slice(0,7)===month;});
    var income=visible.filter(function(item){return item.kind==="income";}).reduce(function(sum,item){return sum+item.amount;},0);
    var expense=visible.filter(function(item){return item.kind==="expense";}).reduce(function(sum,item){return sum+item.amount;},0);
    document.getElementById("incomeTotal").textContent=formatMoney(income);
    document.getElementById("expenseTotal").textContent=formatMoney(expense);
    document.getElementById("balanceTotal").textContent=formatMoney(income-expense);
    var rows=document.getElementById("rows");
    if(!visible.length){
      rows.innerHTML='<tr><td colspan="6" class="empty">這個月還沒有記錄</td></tr>';
      return;
    }
    rows.innerHTML=visible.slice().sort(function(a,b){return b.date.localeCompare(a.date)||b.id-a.id;}).map(function(item){
      return "<tr><td class='editable-cell' data-edit-field='date' data-id='"+item.id+"' title='點擊修改'>"+escapeHtml(item.date)+"</td><td class='editable-cell' data-edit-field='kind' data-id='"+item.id+"' title='點擊修改'>"+(item.kind==="income"?"收入":"支出")+"</td><td class='editable-cell' data-edit-field='category' data-id='"+item.id+"' title='點擊修改'>"+
        escapeHtml(item.category)+"</td><td class='editable-cell' data-edit-field='note' data-id='"+item.id+"' title='點擊修改'>"+escapeHtml(item.note||"—")+"</td><td class='editable-cell amount "+
        (item.kind==="income"?"income":"expense")+" editable-cell' data-edit-field='amount' data-id='"+item.id+"' title='點擊修改'>"+(item.kind==="income"?"+":"−")+formatMoney(item.amount)+
        "</td><td><button class='delete' type='button' data-action='delete' data-id='"+item.id+"'>刪除</button></td></tr>";
    }).join("");
  }

  document.getElementById("kind").addEventListener("change",updateCategories);
  document.getElementById("prev").addEventListener("click",function(){selectedMonth.setMonth(selectedMonth.getMonth()-1);render();});
  document.getElementById("next").addEventListener("click",function(){selectedMonth.setMonth(selectedMonth.getMonth()+1);render();});
  document.getElementById("entryDate").value=localDate();
  document.getElementById("entryForm").addEventListener("submit",function(event){
    event.preventDefault();
    var amount=Number(document.getElementById("amount").value);
    var message=document.getElementById("message");
    message.textContent="";
    if(!Number.isSafeInteger(amount)||amount<=0){message.textContent="請輸入大於 0 的整數金額。";return;}
    var entry={
      id:Date.now()+Math.floor(Math.random()*1000),
      kind:document.getElementById("kind").value,
      amount:amount,
      category:document.getElementById("category").value,
      date:document.getElementById("entryDate").value,
      note:document.getElementById("note").value.trim()
    };
    entries.push(entry);
    try { saveEntries(); }
    catch(error){entries.pop();message.textContent="瀏覽器無法保存資料，請檢查儲存空間設定。";return;}
    if(window.moneycountSyncSave)window.moneycountSyncSave(entry);
    this.reset();
    document.getElementById("entryDate").value=localDate();
    updateCategories();
    render();
  });
  function finishCellEdit(cell,save){
    if(!cell||cell.getAttribute("data-editing")!=="true")return;
    var editor=cell.querySelector(".cell-editor"),id=Number(cell.getAttribute("data-id")),field=cell.getAttribute("data-edit-field");
    var current=entries.find(function(item){return Number(item.id)===id;});
    if(!editor||!current)return;
    cell.setAttribute("data-editing","false");
    if(!save){render();return;}
    var value=editor.value,updated=Object.assign({},current),message=document.getElementById("message");
    message.textContent="";
    if(field==="amount"){
      value=Number(value);
      if(!Number.isSafeInteger(value)||value<=0){message.textContent="金額請填寫大於 0 的整數。";render();return;}
    }else if(field==="date"){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(value)||Number.isNaN(Date.parse(value+"T00:00:00"))||new Date(value+"T00:00:00").toISOString().slice(0,10)!==value){message.textContent="請填寫有效日期。";render();return;}
    }else if(field==="kind"&&["income","expense"].indexOf(value)<0){render();return;}
    else if(field==="category"&&categoryMap[current.kind].indexOf(value)<0){message.textContent="請選擇有效分類。";render();return;}
    else if(field==="note")value=value.trim();
    updated[field]=value;
    var index=entries.indexOf(current);entries[index]=updated;
    try{saveEntries();}catch(error){entries[index]=current;message.textContent="儲存失敗，請檢查瀏覽器儲存空間。";render();return;}
    if(window.moneycountSyncSave)window.moneycountSyncSave(updated);
    render();message.textContent="已儲存並同步這項修改。";
  }
  document.getElementById("rows").addEventListener("click",function(event){
    var cell=event.target.closest("td[data-edit-field]"),field,id,current,editor,options;
    if(!cell||cell.getAttribute("data-editing")==="true")return;
    field=cell.getAttribute("data-edit-field");id=Number(cell.getAttribute("data-id"));
    current=entries.find(function(item){return Number(item.id)===id;});if(!current)return;
    if(field==="date"||field==="amount"||field==="note"){
      editor=document.createElement("input");editor.className="cell-editor";
      editor.type=field==="date"?"date":field==="amount"?"number":"text";
      if(field==="amount"){editor.min="1";editor.step="1";}
      if(field==="note")editor.maxLength=120;
      editor.value=field==="note"?current.note||"":current[field];
    }else{
      editor=document.createElement("select");editor.className="cell-editor";
      options=field==="kind"?[{value:"expense",label:"支出"},{value:"income",label:"收入"}]:categoryMap[current.kind].map(function(name){return {value:name,label:name};});
      options.forEach(function(option){var node=document.createElement("option");node.value=option.value;node.textContent=option.label;editor.appendChild(node);});
      editor.value=current[field];
    }
    cell.setAttribute("data-editing","true");cell.replaceChildren(editor);editor.focus();
    if(editor.select)editor.select();
    editor.addEventListener("keydown",function(keyEvent){
      if(keyEvent.key==="Escape"){keyEvent.preventDefault();finishCellEdit(cell,false);}
      else if(keyEvent.key==="Enter"&&editor.tagName!=="SELECT"){keyEvent.preventDefault();finishCellEdit(cell,true);}
    });
    editor.addEventListener("change",function(){if(editor.tagName==="SELECT"||field==="date")finishCellEdit(cell,true);});
    editor.addEventListener("blur",function(){finishCellEdit(cell,true);});
  });
  document.getElementById("rows").addEventListener("click",function(event){
    var button=event.target.closest("button[data-action]"),id,current;
    if(!button)return;
    id=Number(button.getAttribute("data-id"));if(!id)return;
    current=entries.find(function(item){return Number(item.id)===id;});if(!current)return;
    entries=entries.filter(function(item){return Number(item.id)!==id;});
    saveEntries();
    if(window.moneycountSyncDelete)window.moneycountSyncDelete(id);
    render();
  });
  updateCategories();
  render();
})();
</script>

<script type="module">

    function addAiMessage(text,role){
      var bubble=document.createElement("div");bubble.className="ai-message"+(role==="user"?" user":"");bubble.textContent=text;
      aiMessages.appendChild(bubble);aiMessages.scrollTop=aiMessages.scrollHeight;
    }
    async function generateWithFallback(prompt){
      var models=[
        {model:aiModel,name:"Gemini 4 Hydrogen"},
        {model:aiFallbackModel,name:"Gemini 3.5 Flash-Lite"},
        {model:aiEmergencyModel,name:"Gemini 3.8 Flash"}
      ];
      var overloadPattern=/high demand|temporarily unavailable|\[\s*5\d\d\s*\]|\b429\b/i;
      var lastError=null;
      for(var i=0;i<models.length;i++){
        if(!models[i].model)continue;
        try{return await models[i].model.generateContent(prompt);}
        catch(error){
          lastError=error;
          if(!overloadPattern.test(String(error.message||error))||i===models.length-1)throw error;
          aiStatus.textContent=""+models[i].name+" 忙碌中，正在切換備援模型…";
        }
      }
      throw lastError||new Error("Gemini 模型目前無法使用");
    }
    function validAiEntry(item){
      return item&&["income","expense"].indexOf(item.kind)>=0&&Number.isSafeInteger(Number(item.amount))&&Number(item.amount)>0&&
        (item.kind==="income"?["薪水","獎金","禮金","其他"]:["飲食","交通","生活","購物","娛樂","其他"]).indexOf(item.category)>=0&&
        /^\d{4}-\d{2}-\d{2}$/.test(item.date)&&!Number.isNaN(Date.parse(item.date+"T00:00:00"))&&String(item.note||"").length<=120;
    }
    function showAiProposal(change){
      pendingAiChange=change;aiProposal.replaceChildren();aiProposal.hidden=false;
      var heading=document.createElement("strong");heading.textContent=change.type==="add"?"新增記錄預覽":change.type==="update"?"修改記錄預覽":"刪除記錄預覽";aiProposal.appendChild(heading);
      var detail=document.createElement("p");
      if(change.type==="delete"){

        detail.textContent=old?old.date+" · "+(old.kind==="income"?"收入":"支出")+" · "+old.category+" · "+old.amount+" · "+(old.note||"無備註"):"找不到原記錄";
      }else{
        var item=change.entry;
        detail.textContent=item.date+" · "+(item.kind==="income"?"收入":"支出")+" · "+item.category+" · "+item.amount+" · "+(item.note||"無備註");
      }
      aiProposal.appendChild(detail);
      var apply=document.createElement("button");apply.type="button";apply.textContent="確認套用";
      apply.addEventListener("click",function(){
        if(!pendingAiChange)return;
        try{window.moneycountApplyAiChange(pendingAiChange);addAiMessage("已依照你的確認更新記帳資料。","model");aiProposal.hidden=true;pendingAiChange=null;aiStatus.textContent="已同步至你的帳戶。";}
        catch(error){aiStatus.textContent=error.message||"套用失敗，請再試一次。";}
      });
      var cancel=document.createElement("button");cancel.type="button";cancel.className="cancel";cancel.textContent="取消";
      cancel.addEventListener("click",function(){pendingAiChange=null;aiProposal.hidden=true;aiStatus.textContent="已取消，沒有修改資料。";});
      var buttons=document.createElement("div");buttons.append(apply,cancel);aiProposal.appendChild(buttons);
    }
    aiForm.addEventListener("submit",async function(event){
      event.preventDefault();var question=aiInput.value.trim();if(!question)return;
      if(!authInstance.currentUser){aiStatus.textContent="請先使用 Google 登入，Gemini 才能查看你的記帳內容。";return;}
      if(!aiModel||!appCheckReady){aiStatus.textContent="Gemini 尚未完成 Firebase AI Logic / App Check 設定。";return;}
      if(pendingAiChange){aiStatus.textContent="請先確認或取消目前的變更預覽。";return;}
      addAiMessage(question,"user");aiInput.value="";aiSend.disabled=true;aiStatus.textContent="Gemini 正在整理…";
      try{
        var ledger=(window.moneycountGetEntries?window.moneycountGetEntries():[]).slice(-300);
        var prompt=[
          "你是記帳日常的繁體中文財務記帳助理。只能根據 ledger 回答，不可捏造資料。使用者要求修改或刪除時，只提出單一明確操作；若目標不唯一或資訊不足，action.type 設為 none，並在 message 詢問澄清。不要直接宣稱已修改。",
          "請只回傳 JSON，不要 Markdown，格式：{\"message\":\"給使用者的繁體中文回覆\",\"action\":{\"type\":\"none|add|update|delete\",\"id\":null,\"entry\":null}}。",
          "add/update 的 entry 必須含 kind(income/expense), amount(正整數), category, date(YYYY-MM-DD), note。update/delete 的 id 必須是 ledger 裡存在的 id。更新時請輸出完整的新 entry。分類只可選支出：飲食、交通、生活、購物、娛樂、其他；收入：薪水、獎金、禮金、其他。無法明確推斷日期、金額、種類、分類或目標時請 action.type=none 並詢問。",
          "今天日期="+(function(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})(),
          "ledger="+JSON.stringify(ledger),
          "最近對話="+JSON.stringify(aiHistory.slice(-8)),
          "使用者訊息="+question
        ].join("\n\n");
        var result=await generateWithFallback(prompt);
        var payload=JSON.parse(result.response.text());
        var message=String(payload.message||"我需要更多資訊才能協助你。");addAiMessage(message,"model");
        if(payload.action&&payload.action.type==="add"&&validAiEntry(payload.action.entry))showAiProposal({type:"add",entry:{kind:payload.action.entry.kind,amount:Number(payload.action.entry.amount),category:payload.action.entry.category,date:payload.action.entry.date,note:String(payload.action.entry.note||"")}});
        else if(payload.action&&payload.action.type==="update"){
          var target=ledger.find(function(item){return Number(item.id)===Number(payload.action.id);});
          if(target&&validAiEntry(payload.action.entry))showAiProposal({type:"update",id:Number(target.id),entry:{kind:payload.action.entry.kind,amount:Number(payload.action.entry.amount),category:payload.action.entry.category,date:payload.action.entry.date,note:String(payload.action.entry.note||"")}});
          else if(payload.action.type!=="none")addAiMessage("我無法安全確認這筆記錄或內容，沒有提出修改。","model");
        }else if(payload.action&&payload.action.type==="delete"){
          var found=ledger.find(function(item){return Number(item.id)===Number(payload.action.id);});
          if(found)showAiProposal({type:"delete",id:Number(found.id)});else addAiMessage("找不到要刪除的記錄，沒有提出變更。","model");
        }else if(payload.action&&payload.action.type!=="none")addAiMessage("變更資料格式不完整，沒有提出變更。","model");
        aiHistory.push({role:"user",text:question},{role:"assistant",text:message});aiHistory=aiHistory.slice(-8);aiStatus.textContent="";
      }catch(error){
        console.error("Gemini request failed",error);
        var errorText=String(error.message||error);
        aiStatus.textContent=/high demand|temporarily unavailable|\[\s*500\s*\]|\[\s*503\s*\]|429/i.test(errorText)?"Gemini 目前忙碌，暫時無法回覆。這次沒有修改帳本，請稍後重試。":"Gemini 回覆失敗，這次沒有修改帳本。請檢查網路或稍後再試。";
      }finally{aiSend.disabled=false;}
    });
    var authInstance=authSdk.getAuth(app);
    var provider=new authSdk.GoogleAuthProvider();
    provider.setCustomParameters({prompt:"select_account"});
    var db=firestoreSdk.getFirestore(app);
    var activeUid=null;
    var stopListening=null;
    var syncRun=0;
    function stopCloudSync(){
      syncRun++;
      activeUid=null;
      if(stopListening){stopListening();stopListening=null;}
    }
    async function startCloudSync(user){
      stopCloudSync();
      var thisRun=syncRun;
      activeUid=user.uid;
      status.textContent="正在連接記帳資料…";
      var entriesRef=firestoreSdk.collection(db,"users",user.uid,"entries");
      try{
        var remote=await firestoreSdk.getDocs(entriesRef);
        if(thisRun!==syncRun)return;
        var owner=localStorage.getItem("moneycount_cloud_owner");
        var migrationKey="moneycount_migrated_"+user.uid;
        var mayImport=!localStorage.getItem(migrationKey)&&(!owner||owner===user.uid);
        if(mayImport){
          var localEntries=window.moneycountGetEntries?window.moneycountGetEntries():[];
          var remoteIds=new Set(remote.docs.map(function(item){return item.id;}));
          var missing=localEntries.filter(function(item){return !remoteIds.has(String(item.id));});
          for(var i=0;i<missing.length;i+=450){
            var batch=firestoreSdk.writeBatch(db);
            missing.slice(i,i+450).forEach(function(item){
              batch.set(firestoreSdk.doc(entriesRef,String(item.id)),item);
            });
            await batch.commit();
          }
          localStorage.setItem(migrationKey,"1");
        }
        localStorage.setItem("moneycount_cloud_owner",user.uid);
        stopListening=firestoreSdk.onSnapshot(entriesRef,function(snapshot){
          if(thisRun!==syncRun)return;
          var cloudEntries=snapshot.docs.map(function(item){
            var data=item.data();data.id=Number(item.id);return data;
          }).filter(function(item){return Number.isSafeInteger(item.id);});
          if(window.moneycountApplyCloudEntries)window.moneycountApplyCloudEntries(cloudEntries);
          status.textContent=(user.displayName||user.email||"已登入")+" · 已同步";
        },function(error){
          status.textContent="同步失敗（"+(error.code||"未知錯誤")+"），本機記錄仍保留";
        });
      }catch(error){
        status.textContent="雲端連線失敗（"+(error.code||"未知錯誤")+"），請確認 Firestore 與 Rules 設定";
      }
    }
    window.moneycountSyncSave=async function(entry){
      if(!activeUid)return;
      try{
        await firestoreSdk.setDoc(firestoreSdk.doc(db,"users",activeUid,"entries",String(entry.id)),entry);
      }catch(error){
        status.textContent="雲端儲存失敗（"+(error.code||"未知錯誤")+"），本機記錄仍保留";
      }
    };
    window.moneycountSyncDelete=async function(id){
      if(!activeUid)return;
      try{
        await firestoreSdk.deleteDoc(firestoreSdk.doc(db,"users",activeUid,"entries",String(id)));
      }catch(error){
        status.textContent="雲端刪除失敗（"+(error.code||"未知錯誤")+"）";
      }
    };
    authSdk.onAuthStateChanged(authInstance,function(user){
      var nextUid=user?user.uid:null;
      if(nextUid!==aiUid){
        aiUid=nextUid;aiHistory=[];pendingAiChange=null;aiProposal.hidden=true;
        aiMessages.replaceChildren();addAiMessage(user?"已登入，可以詢問你的收支或提出記帳變更；送出時資料會傳給 Google Gemini。":"你好！登入後即可使用 Gemini 記帳小幫手。","model");
      }
      if(user){
        loginButton.hidden=true;
        logoutButton.hidden=false;
        startCloudSync(user);
      }else{
        stopCloudSync();
        status.textContent=location.protocol==="file:"?"請以 HTTPS 網址或 localhost 開啟才能登入":"尚未登入";
        loginButton.hidden=false;
        logoutButton.hidden=true;
      }
    });
    loginButton.addEventListener("click",async function(){
      if(location.protocol==="file:"){
        status.textContent="請改用 GitHub Pages 網址，或透過 localhost 開啟。";
        return;
      }
      loginButton.disabled=true;
      try{await authSdk.signInWithPopup(authInstance,provider);}
      catch(error){
        var messages={
          "auth/unauthorized-domain":"Firebase 尚未授權這個網域，請在 Authentication → Settings → Authorized domains 加入目前網域。",
          "auth/operation-not-allowed":"Firebase 尚未啟用 Google 登入，請在 Authentication → Sign-in method 開啟 Google。",
          "auth/popup-blocked":"登入視窗遭封鎖，請允許彈出視窗後再試。",
          "auth/network-request-failed":"連線失敗，請檢查網路後再試。"
        };
        status.textContent=messages[error.code]||("登入失敗："+(error.code||error.message||"未知錯誤"));
      }finally{loginButton.disabled=false;}
    });
    logoutButton.addEventListener("click",async function(){
      try{await authSdk.signOut(authInstance);}
      catch(error){status.textContent="登出失敗："+(error.code||"未知錯誤");}
    });
  }catch(error){
    status.textContent=location.protocol==="file:"?"此檔案可記帳；Google 登入請改用 HTTPS 網址或 localhost。":"Firebase 載入失敗，請檢查網路或 SDK 連線。";
    console.error("Firebase Auth initialization failed",error);
  }
})();
</script>
</body>
</html>
